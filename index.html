<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>1초 기상 캐스터</title>
  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#2563eb" id="themeColor">
  <link rel="apple-touch-icon" href="icon-192.png">
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Apple SD Gothic Neo", "Malgun Gothic", sans-serif;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: flex-start;
      background: linear-gradient(135deg, #2563eb, #60a5fa);
      color: #ffffff;
      padding: 20px 16px 40px;
      transition: background 0.5s ease;
    }
    body.rain-mode {
      background: linear-gradient(135deg, #0f172a, #334155);
    }
    body.snow-mode {
      background: linear-gradient(135deg, #475569, #94a3b8);
    }
    .app-card {
      width: 100%;
      max-width: 430px;
      background: rgba(255, 255, 255, 0.16);
      backdrop-filter: blur(14px);
      -webkit-backdrop-filter: blur(14px);
      border-radius: 28px;
      padding: 22px 20px;
      box-shadow: 0 20px 40px rgba(0, 0, 0, 0.2);
      border: 1px solid rgba(255, 255, 255, 0.25);
    }

    /* 상단 바 */
    .top-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 8px;
      margin-bottom: 14px;
    }
    .location-btn {
      background: rgba(255, 255, 255, 0.22);
      border: 1px solid rgba(255, 255, 255, 0.25);
      color: #ffffff;
      padding: 7px 12px;
      border-radius: 20px;
      font-size: 13px;
      font-weight: 700;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 4px;
      max-width: 52%;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .action-group {
      display: flex;
      gap: 6px;
    }
    .icon-btn {
      background: rgba(255, 255, 255, 0.22);
      border: none;
      color: #ffffff;
      padding: 7px 10px;
      border-radius: 18px;
      font-size: 12px;
      font-weight: 700;
      cursor: pointer;
      transition: transform 0.15s, background 0.2s;
    }
    .icon-btn:active { transform: scale(0.94); }
    .icon-btn.speaking {
      background: #facc15;
      color: #1e293b;
    }

    /* 도시 검색 패널 */
    .city-panel {
      display: none;
      background: rgba(15, 23, 42, 0.45);
      border-radius: 18px;
      padding: 12px;
      margin-bottom: 16px;
      border: 1px solid rgba(255, 255, 255, 0.2);
    }
    .city-panel.open { display: block; }
    .search-row {
      display: flex;
      gap: 6px;
      margin-bottom: 10px;
    }
    .search-input {
      flex: 1;
      border: none;
      border-radius: 12px;
      padding: 9px 12px;
      font-size: 13px;
      outline: none;
      color: #1e293b;
    }
    .search-submit {
      background: #38bdf8;
      color: #0f172a;
      border: none;
      border-radius: 12px;
      padding: 0 14px;
      font-size: 13px;
      font-weight: 800;
      cursor: pointer;
    }
    .city-chips {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
    }
    .city-chip {
      background: rgba(255, 255, 255, 0.2);
      border: none;
      color: #ffffff;
      padding: 5px 10px;
      border-radius: 14px;
      font-size: 12px;
      font-weight: 600;
      cursor: pointer;
    }
    .city-chip:hover { background: rgba(255, 255, 255, 0.35); }

    /* 메인 날씨 영역 */
    .hero-section {
      text-align: center;
      margin-bottom: 18px;
    }
    .weather-icon {
      font-size: 76px;
      line-height: 1.1;
      margin-bottom: 8px;
    }
    .verdict {
      font-size: 26px;
      font-weight: 800;
      letter-spacing: -0.5px;
      margin-bottom: 6px;
    }
    .sub-info {
      font-size: 14px;
      opacity: 0.92;
      margin-bottom: 10px;
    }
    .outfit-badge {
      display: inline-block;
      background: rgba(255, 255, 255, 0.22);
      padding: 7px 14px;
      border-radius: 20px;
      font-size: 13px;
      font-weight: 700;
    }

    /* 상세 지표 4종 그리드 */
    .metrics-grid {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 8px;
      margin-bottom: 16px;
    }
    .metric-card {
      background: rgba(255, 255, 255, 0.16);
      border-radius: 16px;
      padding: 10px 6px;
      text-align: center;
    }
    .metric-label {
      font-size: 11px;
      opacity: 0.85;
      margin-bottom: 4px;
    }
    .metric-value {
      font-size: 14px;
      font-weight: 800;
    }

    /* 시간대별 예보 */
    .section-card {
      background: rgba(255, 255, 255, 0.16);
      border-radius: 20px;
      padding: 14px;
      margin-bottom: 16px;
    }
    .section-header {
      font-size: 13px;
      font-weight: 700;
      opacity: 0.92;
      margin-bottom: 10px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    .hourly-scroll {
      display: flex;
      gap: 8px;
      overflow-x: auto;
      padding-bottom: 4px;
    }
    .hourly-scroll::-webkit-scrollbar { height: 4px; }
    .hourly-scroll::-webkit-scrollbar-thumb {
      background: rgba(255, 255, 255, 0.35);
      border-radius: 4px;
    }
    .hour-item {
      min-width: 58px;
      background: rgba(255, 255, 255, 0.14);
      border-radius: 14px;
      padding: 8px 6px;
      text-align: center;
      flex-shrink: 0;
    }
    .hour-time { font-size: 11px; opacity: 0.85; margin-bottom: 4px; }
    .hour-icon { font-size: 20px; margin-bottom: 4px; }
    .hour-temp { font-size: 14px; font-weight: 800; }
    .hour-rain { font-size: 11px; color: #bae6fd; margin-top: 2px; font-weight: 600; }

    /* 외출 준비물 체크리스트 */
    .checklist-box {
      background: rgba(255, 255, 255, 0.96);
      color: #1e293b;
      border-radius: 22px;
      padding: 18px;
      margin-bottom: 16px;
    }
    .checklist-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 12px;
    }
    .checklist-title {
      font-size: 14px;
      font-weight: 800;
      color: #475569;
    }
    .progress-badge {
      background: #dbeafe;
      color: #1d4ed8;
      font-size: 12px;
      font-weight: 800;
      padding: 3px 10px;
      border-radius: 12px;
    }
    .item-list {
      display: flex;
      flex-direction: column;
      gap: 8px;
      margin-bottom: 12px;
    }
    .item {
      display: flex;
      align-items: center;
      justify-content: space-between;
      background: #f1f5f9;
      padding: 11px 14px;
      border-radius: 14px;
      font-size: 15px;
      font-weight: 700;
      cursor: pointer;
      transition: all 0.2s;
      user-select: none;
    }
    .item.checked {
      background: #e2e8f0;
      color: #94a3b8;
      text-decoration: line-through;
    }
    .item-left {
      display: flex;
      align-items: center;
      gap: 10px;
    }
    .check-circle {
      width: 20px;
      height: 20px;
      border-radius: 50%;
      border: 2px solid #94a3b8;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 12px;
      color: transparent;
      flex-shrink: 0;
    }
    .item.checked .check-circle {
      background: #2563eb;
      border-color: #2563eb;
      color: #ffffff;
    }
    .del-btn {
      background: none;
      border: none;
      color: #94a3b8;
      font-size: 16px;
      font-weight: 700;
      cursor: pointer;
      padding: 2px 6px;
    }
    .del-btn:hover { color: #ef4444; }
    .add-item-row {
      display: flex;
      gap: 6px;
    }
    .add-item-input {
      flex: 1;
      border: 1.5px solid #cbd5e1;
      border-radius: 12px;
      padding: 8px 12px;
      font-size: 13px;
      outline: none;
    }
    .add-item-input:focus { border-color: #2563eb; }
    .add-item-btn {
      background: #2563eb;
      color: #ffffff;
      border: none;
      border-radius: 12px;
      padding: 0 14px;
      font-size: 13px;
      font-weight: 700;
      cursor: pointer;
    }

    /* 주간 예보 */
    .daily-list {
      display: flex;
      flex-direction: column;
      gap: 8px;
    }
    .daily-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      background: rgba(255, 255, 255, 0.12);
      padding: 9px 12px;
      border-radius: 12px;
      font-size: 13px;
      font-weight: 700;
    }
    .daily-day { width: 52px; }
    .daily-mid { display: flex; align-items: center; gap: 6px; }
    .daily-rain { font-size: 12px; color: #bae6fd; }
    .daily-temps { font-weight: 800; }

    /* 알림 토스트 */
    .toast {
      position: fixed;
      bottom: 24px;
      left: 50%;
      transform: translateX(-50%) translateY(80px);
      background: rgba(15, 23, 42, 0.92);
      color: #ffffff;
      padding: 10px 18px;
      border-radius: 24px;
      font-size: 13px;
      font-weight: 700;
      opacity: 0;
      transition: all 0.3s ease;
      z-index: 999;
      pointer-events: none;
    }
    .toast.show {
      opacity: 1;
      transform: translateX(-50%) translateY(0);
    }
  </style>
</head>
<body>
  <div class="app-card">
    <!-- 상단 바 -->
    <div class="top-bar">
      <button class="location-btn" onclick="toggleCityPanel()" id="locationText">📍 위치 확인 중... ▾</button>
      <div class="action-group">
        <button class="icon-btn" id="ttsBtn" onclick="speakBriefing()">🔊 듣기</button>
        <button class="icon-btn" onclick="copyBriefing()">📋 복사</button>
        <button class="icon-btn" onclick="refreshCurrent()">🔄</button>
      </div>
    </div>

    <!-- 도시 검색 및 빠른 전환 패널 -->
    <div class="city-panel" id="cityPanel">
      <div class="search-row">
        <input type="text" class="search-input" id="citySearchInput" placeholder="도시명 입력 (예: 부산, 김포, 도쿄)" onkeydown="if(event.key==='Enter') searchCity()">
        <button class="search-submit" onclick="searchCity()">검색</button>
      </div>
      <div class="city-chips">
        <button class="city-chip" onclick="useGPS()">📡 내 위치</button>
        <button class="city-chip" onclick="selectPresetCity('서울', 37.5665, 126.9780)">서울</button>
        <button class="city-chip" onclick="selectPresetCity('부산', 35.1796, 129.0756)">부산</button>
        <button class="city-chip" onclick="selectPresetCity('제주', 33.4996, 126.5312)">제주</button>
        <button class="city-chip" onclick="selectPresetCity('강릉', 37.7519, 128.8761)">강릉</button>
        <button class="city-chip" onclick="selectPresetCity('대전', 36.3504, 127.3845)">대전</button>
      </div>
    </div>

    <!-- 메인 1초 판정 영역 -->
    <div class="hero-section">
      <div class="weather-icon" id="mainIcon">⏳</div>
      <div class="verdict" id="verdictText">날씨 불러오는 중...</div>
      <div class="sub-info" id="subInfo">잠시만 기다려 주세요</div>
      <div class="outfit-badge" id="outfitText">👕 오늘의 옷차림 분석 중...</div>
    </div>

    <!-- 상세 지표 4종 -->
    <div class="metrics-grid">
      <div class="metric-card">
        <div class="metric-label">체감온도</div>
        <div class="metric-value" id="feelsLikeVal">-°</div>
      </div>
      <div class="metric-card">
        <div class="metric-label">습도</div>
        <div class="metric-value" id="humidityVal">-%</div>
      </div>
      <div class="metric-card">
        <div class="metric-label">바람</div>
        <div class="metric-value" id="windVal">-m/s</div>
      </div>
      <div class="metric-card">
        <div class="metric-label">자외선</div>
        <div class="metric-value" id="uvVal">-</div>
      </div>
    </div>

    <!-- 시간대별 예보 -->
    <div class="section-card">
      <div class="section-header">
        <span>🕒 시간대별 날씨 (3시간 간격)</span>
      </div>
      <div class="hourly-scroll" id="hourlyList">
        <div class="hour-item"><div class="hour-time">--시</div><div class="hour-icon">⏳</div><div class="hour-temp">-°</div></div>
      </div>
    </div>

    <!-- 1초 외출 준비물 체크리스트 -->
    <div class="checklist-box">
      <div class="checklist-header">
        <span class="checklist-title">⚡ 1초 외출 준비물 체크</span>
        <span class="progress-badge" id="progressBadge">0/0 완료</span>
      </div>
      <div class="item-list" id="itemList"></div>
      <div class="add-item-row">
        <input type="text" class="add-item-input" id="customItemInput" placeholder="나만의 준비물 추가 (예: 보조배터리)" onkeydown="if(event.key==='Enter') addCustomItem()">
        <button class="add-item-btn" onclick="addCustomItem()">+ 추가</button>
      </div>
    </div>

    <!-- 주간 5일 예보 -->
    <div class="section-card" style="margin-bottom: 0;">
      <div class="section-header">
        <span>📅 주간 날씨 예보</span>
      </div>
      <div class="daily-list" id="dailyList"></div>
    </div>
  </div>

  <div class="toast" id="toast"></div>

  <script>
    if ('serviceWorker' in navigator && location.protocol.startsWith('http')) {
      navigator.serviceWorker.register('sw.js').catch(() => {});
    }

    let currentCoords = { lat: 37.5665, lon: 126.9780, name: '서울 (기본 위치)', isGPS: true };
    let latestSummaryForShare = '';
    let autoRecommendedItems = [];
    let customItems = JSON.parse(localStorage.getItem('wc_custom_items') || '[]');
    let checkedSet = new Set(JSON.parse(localStorage.getItem('wc_checked_items') || '[]'));

    function showToast(msg) {
      const toast = document.getElementById('toast');
      toast.innerText = msg;
      toast.classList.add('show');
      setTimeout(() => toast.classList.remove('show'), 2300);
    }

    function toggleCityPanel() {
      document.getElementById('cityPanel').classList.toggle('open');
    }

    function useGPS() {
      document.getElementById('cityPanel').classList.remove('open');
      initWeather();
    }

    function selectPresetCity(name, lat, lon) {
      document.getElementById('cityPanel').classList.remove('open');
      currentCoords = { lat, lon, name, isGPS: false };
      document.getElementById('locationText').innerText = `📍 ${name} ▾`;
      fetchWeather(lat, lon, name);
    }

    async function searchCity() {
      const query = document.getElementById('citySearchInput').value.trim();
      if (!query) return showToast('도시 이름을 입력해 주세요');
      try {
        const res = await fetch(`https://geocoding-api.open-meteo.com/v1/search?name=${encodeURIComponent(query)}&count=1&language=ko&format=json`);
        const data = await res.json();
        if (!data.results || data.results.length === 0) {
          return showToast('해당 도시를 찾을 수 없어요');
        }
        const place = data.results[0];
        const label = place.admin1 && place.admin1 !== place.name ? `${place.name} (${place.admin1})` : place.name;
        document.getElementById('citySearchInput').value = '';
        selectPresetCity(label, place.latitude, place.longitude);
      } catch (e) {
        showToast('도시 검색 중 오류가 발생했어요');
      }
    }

    function refreshCurrent() {
      if (currentCoords.isGPS) {
        initWeather();
      } else {
        fetchWeather(currentCoords.lat, currentCoords.lon, currentCoords.name);
      }
      showToast('최신 날씨로 업데이트했어요');
    }

    function initWeather() {
      document.getElementById('mainIcon').innerText = '⏳';
      document.getElementById('verdictText').innerText = '날씨 확인 중...';

      if (navigator.geolocation) {
        navigator.geolocation.getCurrentPosition(
          (pos) => {
            const { latitude, longitude } = pos.coords;
            currentCoords = { lat: latitude, lon: longitude, name: '현재 위치', isGPS: true };
            fetch(`https://api.bigdatacloud.net/data/reverse-geocode-client?latitude=${latitude}&longitude=${longitude}&localityLanguage=ko`)
              .then(r => r.json())
              .then(geo => {
                const city = geo.city || geo.locality || '현재 위치';
                currentCoords.name = city;
                document.getElementById('locationText').innerText = `📍 ${city} ▾`;
              })
              .catch(() => {
                document.getElementById('locationText').innerText = '📍 현재 위치 ▾';
              });
            fetchWeather(latitude, longitude, null);
          },
          () => {
            currentCoords = { lat: 37.5665, lon: 126.9780, name: '서울 (기본 위치)', isGPS: false };
            document.getElementById('locationText').innerText = '📍 서울 (기본) ▾';
            fetchWeather(37.5665, 126.9780, '서울');
          },
          { timeout: 5000 }
        );
      } else {
        selectPresetCity('서울', 37.5665, 126.9780);
      }
    }

    function weatherCodeToEmoji(code) {
      const rainCodes = [51, 53, 55, 56, 57, 61, 63, 65, 66, 67, 80, 81, 82, 95, 96, 99];
      const snowCodes = [71, 73, 75, 77, 85, 86];
      if (snowCodes.includes(code)) return '❄️';
      if (rainCodes.includes(code)) return '☔';
      if (code === 0 || code === 1) return '☀️';
      if (code === 2) return '⛅';
      return '☁️';
    }

    async function getFromOpenMeteo(lat, lon) {
      const url = `https://api.open-meteo.com/v1/forecast?latitude=${lat}&longitude=${lon}¤t=temperature_2m,apparent_temperature,relative_humidity_2m,wind_speed_10m,weather_code&hourly=temperature_2m,precipitation_probability,weather_code&daily=weather_code,precipitation_probability_max,temperature_2m_max,temperature_2m_min,uv_index_max&forecast_days=5&timezone=auto`;
      const res = await fetch(url);
      if (!res.ok) throw new Error('Open-Meteo HTTP error');
      const data = await res.json();

      const code = data.current.weather_code;
      const rainCodes = [51, 53, 55, 56, 57, 61, 63, 65, 66, 67, 80, 81, 82, 95, 96, 99];
      const snowCodes = [71, 73, 75, 77, 85, 86];

      const nowHour = new Date().getHours();
      const hourlySlots = [];
      for (let i = nowHour; i < Math.min(nowHour + 24, data.hourly.time.length); i += 3) {
        const hourStr = data.hourly.time[i].split('T')[1].slice(0, 2) + '시';
        hourlySlots.push({
          time: hourStr,
          emoji: weatherCodeToEmoji(data.hourly.weather_code[i]),
          temp: Math.round(data.hourly.temperature_2m[i]),
          rainProb: data.hourly.precipitation_probability[i] || 0
        });
      }

      const dayNames = ['일', '월', '화', '수', '목', '금', '토'];
      const dailySlots = data.daily.time.map((dateStr, idx) => {
        const d = new Date(dateStr);
        const label = idx === 0 ? '오늘' : idx === 1 ? '내일' : `${dayNames[d.getDay()]}요일`;
        return {
          day: label,
          emoji: weatherCodeToEmoji(data.daily.weather_code[idx]),
          rainProb: data.daily.precipitation_probability_max[idx] || 0,
          minTemp: Math.round(data.daily.temperature_2m_min[idx]),
          maxTemp: Math.round(data.daily.temperature_2m_max[idx])
        };
      });

      return {
        temp: Math.round(data.current.temperature_2m),
        feelsLike: Math.round(data.current.apparent_temperature),
        humidity: Math.round(data.current.relative_humidity_2m),
        windSpeed: data.current.wind_speed_10m.toFixed(1),
        uvIndex: Math.round(data.daily.uv_index_max[0] || 0),
        isRaining: rainCodes.includes(code),
        isSnowing: snowCodes.includes(code),
        isClear: code === 0 || code === 1,
        rainProb: data.daily.precipitation_probability_max[0] || 0,
        maxTemp: Math.round(data.daily.temperature_2m_max[0]),
        minTemp: Math.round(data.daily.temperature_2m_min[0]),
        hourly: hourlySlots,
        daily: dailySlots
      };
    }

    async function getFromWttr(lat, lon) {
      const res = await fetch(`https://wttr.in/${lat},${lon}?format=j1`);
      if (!res.ok) throw new Error('wttr error');
      const data = await res.json();
      const cur = data.current_condition[0];
      const today = data.weather[0];
      const wCode = parseInt(cur.weatherCode, 10);
      const rainCodes = [176, 263, 266, 281, 284, 293, 296, 299, 302, 305, 308, 311, 314, 353, 356, 359, 386, 389];
      const snowCodes = [179, 182, 185, 227, 230, 317, 320, 323, 326, 329, 332, 335, 338, 350, 362, 365, 368, 371, 374, 377, 392, 395];
      const rainProb = Math.max(...today.hourly.map(h => parseInt(h.chanceofrain || '0', 10)));

      const hourlySlots = today.hourly.map(h => ({
        time: `${String(parseInt(h.time, 10) / 100).padStart(2, '0')}시`,
        emoji: rainCodes.includes(parseInt(h.weatherCode, 10)) ? '☔' : '⛅',
        temp: parseInt(h.tempC, 10),
        rainProb: parseInt(h.chanceofrain || '0', 10)
      }));

      const dailySlots = data.weather.map((w, idx) => ({
        day: idx === 0 ? '오늘' : idx === 1 ? '내일' : '모레',
        emoji: '⛅',
        rainProb: Math.max(...w.hourly.map(h => parseInt(h.chanceofrain || '0', 10))),
        minTemp: parseInt(w.mintempC, 10),
        maxTemp: parseInt(w.maxtempC, 10)
      }));

      return {
        temp: parseInt(cur.temp_C, 10),
        feelsLike: parseInt(cur.FeelsLikeC, 10),
        humidity: parseInt(cur.humidity, 10),
        windSpeed: (parseInt(cur.windspeedKmph, 10) / 3.6).toFixed(1),
        uvIndex: parseInt(today.uvIndex || '3', 10),
        isRaining: rainCodes.includes(wCode),
        isSnowing: snowCodes.includes(wCode),
        isClear: wCode === 113,
        rainProb,
        maxTemp: parseInt(today.maxtempC, 10),
        minTemp: parseInt(today.mintempC, 10),
        hourly: hourlySlots,
        daily: dailySlots
      };
    }

    async function fetchWeather(lat, lon, cityLabel) {
      if (cityLabel) {
        document.getElementById('locationText').innerText = `📍 ${cityLabel} ▾`;
      }
      try {
        let weather;
        try {
          weather = await getFromOpenMeteo(lat, lon);
        } catch (e1) {
          weather = await getFromWttr(lat, lon);
        }
        renderUI(weather);
      } catch (err) {
        document.getElementById('mainIcon').innerText = '⚠️';
        document.getElementById('verdictText').innerText = '날씨 연결 실패';
        document.getElementById('subInfo').innerText = '네트워크 상태를 확인한 뒤 새로고침을 눌러주세요.';
      }
    }

    function getOutfitAdvice(feelsLike) {
      if (feelsLike <= 4) return '🧥 패딩 · 두꺼운 코트 · 목도리 필수';
      if (feelsLike <= 9) return '🧥 코트 · 경량패딩 · 니트 레이어드';
      if (feelsLike <= 16) return '🧥 자켓 · 가디건 · 맨투맨 추천';
      if (feelsLike <= 22) return '👕 긴팔 티셔츠 · 얇은 셔츠 · 면바지';
      if (feelsLike <= 27) return '👕 반팔 · 얇은 셔츠 · 반바지';
      return '🩳 민소매 · 시원한 린넨 옷차림 추천';
    }

    function renderUI(w) {
      const body = document.body;
      const themeMeta = document.getElementById('themeColor');
      const mainIcon = document.getElementById('mainIcon');
      const verdictText = document.getElementById('verdictText');
      const subInfo = document.getElementById('subInfo');

      body.className = '';
      const isHighRainChance = w.rainProb >= 50;
      let items = [];

      if (w.isSnowing) {
        body.classList.add('snow-mode');
        themeMeta.content = '#475569';
        mainIcon.innerText = '❄️';
        verdictText.innerText = '오늘은 눈이 와요!';
        items = [
          { id: 'auto_1', emoji: '☂️', text: '우산 챙기기' },
          { id: 'auto_2', emoji: '🧤', text: '장갑 · 목도리 착용' },
          { id: 'auto_3', emoji: '🥾', text: '미끄럽지 않은 신발' }
        ];
      } else if (w.isRaining) {
        body.classList.add('rain-mode');
        themeMeta.content = '#0f172a';
        mainIcon.innerText = '☔';
        verdictText.innerText = '지금 비가 오는 날이에요!';
        items = [
          { id: 'auto_1', emoji: '☂️', text: '우산 필수!' },
          { id: 'auto_2', emoji: '👟', text: '젖어도 괜찮은 신발' },
          { id: 'auto_3', emoji: '🧥', text: w.temp <= 15 ? '따뜻한 방수 외투' : '가벼운 바람막이' }
        ];
      } else if (isHighRainChance) {
        body.classList.add('rain-mode');
        themeMeta.content = '#0f172a';
        mainIcon.innerText = '🌦️';
        verdictText.innerText = '곧 비가 올 확률이 높아요!';
        items = [
          { id: 'auto_1', emoji: '🌂', text: '접이식 우산 가방에 쏙' },
          { id: 'auto_2', emoji: '👟', text: '밝은 색 신발은 피하기' },
          { id: 'auto_3', emoji: '🧥', text: w.temp <= 15 ? '따뜻한 겉옷' : '얇은 가디건 · 바람막이' }
        ];
      } else {
        themeMeta.content = '#2563eb';
        mainIcon.innerText = w.isClear ? '☀️' : '⛅';
        verdictText.innerText = '비 소식 없는 날이에요!';
        if (w.temp <= 10) {
          items = [
            { id: 'auto_1', emoji: '🧥', text: '두꺼운 외투 · 패딩' },
            { id: 'auto_2', emoji: '🧣', text: '목도리 또는 핫팩' },
            { id: 'auto_3', emoji: '💧', text: '립밤 · 핸드크림' }
          ];
        } else if (w.temp <= 22) {
          items = [
            { id: 'auto_1', emoji: '🧥', text: '입고 벗기 편한 겉옷' },
            { id: 'auto_2', emoji: '😎', text: '선글라스 (햇빛 차단)' },
            { id: 'auto_3', emoji: '🥤', text: '개인 물병 챙기기' }
          ];
        } else {
          items = [
            { id: 'auto_1', emoji: '🧴', text: '자외선 차단제(선크림)' },
            { id: 'auto_2', emoji: '🕶️', text: '선글라스 · 모자' },
            { id: 'auto_3', emoji: '🧊', text: '시원한 물 · 휴대용 선풍기' }
          ];
        }
      }

      subInfo.innerText = `현재 ${w.temp}°C (최저 ${w.minTemp}° / 최고 ${w.maxTemp}°) · 강수확률 ${w.rainProb}%`;
      document.getElementById('outfitText').innerText = getOutfitAdvice(w.feelsLike);

      document.getElementById('feelsLikeVal').innerText = `${w.feelsLike}°C`;
      document.getElementById('humidityVal').innerText = `${w.humidity}%`;
      document.getElementById('windVal').innerText = `${w.windSpeed}m/s`;
      const uvLevel = w.uvIndex >= 8 ? '매우높음' : w.uvIndex >= 6 ? '높음' : w.uvIndex >= 3 ? '보통' : '낮음';
      document.getElementById('uvVal').innerText = `${w.uvIndex} (${uvLevel})`;

      document.getElementById('hourlyList').innerHTML = w.hourly.map(h => `
        <div class="hour-item">
          <div class="hour-time">${h.time}</div>
          <div class="hour-icon">${h.emoji}</div>
          <div class="hour-temp">${h.temp}°</div>
          <div class="hour-rain">💧${h.rainProb}%</div>
        </div>
      `).join('');

      document.getElementById('dailyList').innerHTML = w.daily.map(d => `
        <div class="daily-row">
          <span class="daily-day">${d.day}</span>
          <div class="daily-mid">
            <span>${d.emoji}</span>
            <span class="daily-rain">💧${d.rainProb}%</span>
          </div>
          <span class="daily-temps">${d.minTemp}° / ${d.maxTemp}°</span>
        </div>
      `).join('');

      autoRecommendedItems = items;
      renderChecklist();

      const itemNames = [...items, ...customItems].map(i => i.text).join(', ');
      latestSummaryForShare = `[1초 기상 캐스터 - ${currentCoords.name}]\n${verdictText.innerText}\n현재 ${w.temp}°C (체감 ${w.feelsLike}°C, 최저 ${w.minTemp}°/최고 ${w.maxTemp}°)\n강수확률: ${w.rainProb}%\n추천 옷차림: ${getOutfitAdvice(w.feelsLike)}\n외출 준비물: ${itemNames}`;
    }

    function renderChecklist() {
      const allItems = [
        ...autoRecommendedItems.map(i => ({ ...i, isCustom: false })),
        ...customItems.map(i => ({ ...i, isCustom: true }))
      ];

      const listEl = document.getElementById('itemList');
      listEl.innerHTML = allItems.map(item => {
        const isChecked = checkedSet.has(item.id);
        return `
          <div class="item ${isChecked ? 'checked' : ''}" onclick="toggleCheck('${item.id}')">
            <div class="item-left">
              <div class="check-circle">✓</div>
              <span>${item.emoji}</span>
              <span>${item.text}</span>
            </div>
            ${item.isCustom ? `<button class="del-btn" onclick="event.stopPropagation(); deleteCustomItem('${item.id}')">×</button>` : ''}
          </div>
        `;
      }).join('');

      const doneCount = allItems.filter(i => checkedSet.has(i.id)).length;
      document.getElementById('progressBadge').innerText = `${doneCount}/${allItems.length} 완료`;
    }

    function toggleCheck(id) {
      if (checkedSet.has(id)) {
        checkedSet.delete(id);
      } else {
        checkedSet.add(id);
      }
      localStorage.setItem('wc_checked_items', JSON.stringify([...checkedSet]));
      renderChecklist();
    }

    function addCustomItem() {
      const input = document.getElementById('customItemInput');
      const text = input.value.trim();
      if (!text) return;
      customItems.push({ id: 'custom_' + Date.now(), emoji: '🎒', text });
      localStorage.setItem('wc_custom_items', JSON.stringify(customItems));
      input.value = '';
      renderChecklist();
      showToast(`'${text}' 준비물이 추가되었어요`);
    }

    function deleteCustomItem(id) {
      customItems = customItems.filter(i => i.id !== id);
      checkedSet.delete(id);
      localStorage.setItem('wc_custom_items', JSON.stringify(customItems));
      localStorage.setItem('wc_checked_items', JSON.stringify([...checkedSet]));
      renderChecklist();
    }

    function speakBriefing() {
      if (!('speechSynthesis' in window)) {
        return showToast('이 브라우저는 음성 안내를 지원하지 않아요');
      }
      const btn = document.getElementById('ttsBtn');
      if (window.speechSynthesis.speaking) {
        window.speechSynthesis.cancel();
        btn.classList.remove('speaking');
        return;
      }
      if (!latestSummaryForShare) return;
      const utter = new SpeechSynthesisUtterance(latestSummaryForShare.replace(/\[|\]/g, ''));
      utter.lang = 'ko-KR';
      utter.rate = 1.05;
      utter.onstart = () => btn.classList.add('speaking');
      utter.onend = () => btn.classList.remove('speaking');
      utter.onerror = () => btn.classList.remove('speaking');
      window.speechSynthesis.speak(utter);
    }

    function copyBriefing() {
      if (!latestSummaryForShare) return;
      navigator.clipboard.writeText(latestSummaryForShare)
        .then(() => showToast('오늘의 날씨 브리핑이 복사되었어요!'))
        .catch(() => showToast('복사에 실패했어요'));
    }

    initWeather();
  </script>
</body>
</html>
